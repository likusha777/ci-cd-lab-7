# Пайплайн CI/CD: автоматический запуск тестов при каждом изменении кода
name: Запуск тестов

# Запускается при любом пуше в любую ветку и вручную из раздела Actions
on:
  push:
  workflow_dispatch:

jobs:
  run_tests:
    name: Запуск Python тестов
    runs-on: ubuntu-latest
    env:
      HEADLESS: "1"
    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Google Chrome уже установлен на раннере ubuntu-latest
      - name: Проверяем версию Chrome
        run: google-chrome --version

      - name: Устанавливаем зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запускаем тесты (параллельно, 2 процесса)
        run: python -m pytest tests/ -v -n 2 -rs --alluredir=allure-results

      - name: Сохраняем результаты Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7
